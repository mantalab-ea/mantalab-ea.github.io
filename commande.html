<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">

<meta property="og:url" content="https://mantalab-ea.github.io/commande.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  /* Mêmes repères que l'accueil : noir et blanc, Inter, filets fins ; le rouge est réservé au danger. */
  :root { --fond:#fff; --fond-2:#f7f7f8; --encre:#0c0d10; --encre-2:#5d6068; --encre-3:#8a8d95; --filet:rgba(12,13,16,.09); --filet-fort:rgba(12,13,16,.16); --focus:#2b6cf6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fond:#0b0c0e; --fond-2:#121317; --encre:#f2f3f5; --encre-2:#9a9ca3; --encre-3:#6c6f77; --filet:rgba(255,255,255,.08); --filet-fort:rgba(255,255,255,.15); } }
  :root[data-theme="dark"] { --fond:#0b0c0e; --fond-2:#121317; --encre:#f2f3f5; --encre-2:#9a9ca3; --encre-3:#6c6f77; --filet:rgba(255,255,255,.08); --filet-fort:rgba(255,255,255,.15); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--encre); font:400 1rem/1.55 "Inter",system-ui,sans-serif; font-optical-sizing:auto; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:3px; border-radius:4px; }
  .contenu { max-width:70rem; margin:0 auto; padding:0 1.5rem; }
  header.barre { position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--fond) 82%, transparent); backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px); border-bottom:1px solid var(--filet); }
  .barre .contenu { display:flex; align-items:center; justify-content:space-between; gap:1rem; height:3.75rem; }
  .logo { height:1.45rem; width:auto; display:block; } .logo-sombre { display:none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-clair { display:none; } :root:not([data-theme="light"]) .logo-sombre { display:block; } }
  :root[data-theme="dark"] .logo-clair { display:none; } :root[data-theme="dark"] .logo-sombre { display:block; }
  .langue { display:flex; gap:.15rem; }
  .langue button { font:500 .8rem/1 "Inter",sans-serif; background:none; border:0; color:var(--encre-3); padding:.35rem .3rem; cursor:pointer; }
  .langue button[aria-pressed="true"] { color:var(--encre); }
  h1 { font-weight:600; font-size:clamp(2.3rem,5vw,3.8rem); line-height:1.03; letter-spacing:-.045em; margin:4.5rem 0 1.2rem; max-width:46rem; text-wrap:balance; }
  .intro { color:var(--encre-2); max-width:38rem; margin:0; font-size:1.1rem; }
  .colonnes { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:3rem; margin-top:3.5rem; align-items:start; }
  .bloc h2 { font-weight:600; letter-spacing:-.02em; font-size:1.05rem; margin:0; padding-bottom:.8rem; border-bottom:1px solid var(--encre); }
  .bloc ul { list-style:none; margin:0; padding:0; }
  .bloc li { padding:.8rem 0; border-bottom:1px solid var(--filet); font-size:.95rem; }
  .achat { border:1px solid var(--filet); border-radius:14px; padding:1.5rem; box-shadow:0 1px 1px rgba(0,0,0,.02), 0 24px 48px -32px rgba(0,0,0,.25); }
  .achat h2 { border-bottom:0; padding-bottom:0; margin-bottom:1rem; color:var(--encre-2); font-weight:500; font-size:.9rem; letter-spacing:0; }
  .prix { font-weight:600; letter-spacing:-.05em; font-size:3.25rem; line-height:1; margin:0 0 .4rem; }
  .prix small { font-weight:400; font-size:.95rem; color:var(--encre-2); letter-spacing:0; }
  .delai { color:var(--encre-2); margin:0 0 1.3rem; font-size:.95rem; }
  .bouton { display:flex; align-items:center; justify-content:center; text-align:center; font:500 .95rem/1.2 "Inter",sans-serif; text-decoration:none; padding:.85rem 1.1rem; border-radius:9px;
    background:var(--encre); color:var(--fond); border:1px solid var(--encre); transition:opacity .15s; }
  .bouton:hover { opacity:.86; }
  .bouton[aria-disabled="true"] { background:var(--fond-2); color:var(--encre-2); border:1px solid var(--filet); cursor:default; opacity:1; }
  .note { font-size:.85rem; color:var(--encre-2); margin:.8rem 0 0; }
  ol.etapes { counter-reset:e; list-style:none; padding:0; margin:0; }
  ol.etapes li { counter-increment:e; display:grid; grid-template-columns:1.6rem 1fr; padding:.8rem 0; border-bottom:1px solid var(--filet); color:var(--encre-2); font-size:.95rem; }
  ol.etapes li::before { content:counter(e); color:var(--encre); font-weight:500; }
  .colonnes .bloc:not(.achat) > p { color:var(--encre-2); font-size:.95rem; padding-top:.8rem; }
  section.faq { margin-top:4.5rem; max-width:46rem; }
  section.faq h2 { font-weight:600; letter-spacing:-.035em; font-size:clamp(1.6rem,3vw,2.2rem); margin:0 0 1rem; }
  details { border-bottom:1px solid var(--filet); padding:1rem 0; } summary { cursor:pointer; font-weight:500; }
  details p { margin:.6rem 0 0; color:var(--encre-2); }
  .retour { display:inline-block; margin-top:2.5rem; color:var(--encre-2); font-size:.9rem; }
  footer { margin-top:5rem; border-top:1px solid var(--filet); padding:2rem 0 3rem; font-size:.8rem; color:var(--encre-3); }
  @media (max-width: 48rem) { .colonnes { grid-template-columns:1fr; gap:2.5rem; } h1 { margin-top:3rem; } }
</style>
</head>
<body>
  <header class="barre"><div class="contenu">
    <a href="index.html"><img class="logo logo-clair" src="marque/mantalab-logo.svg" alt="MantaLab — accueil"><img class="logo logo-sombre" src="marque/mantalab-logo-fond-sombre.svg" alt="MantaLab — accueil"></a>
    <div class="langue" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div></header>

  <main class="contenu">
    <h1 data-t="titre"></h1>
    <p class="intro" data-t="intro"></p>

    <div class="colonnes">
      <div class="bloc">
        <h2 data-t="inclus_titre"></h2>
        <ul>
          <li data-t="inclus_1"></li><li data-t="inclus_2"></li><li data-t="inclus_3"></li>
          <li data-t="inclus_4"></li><li data-t="inclus_5"></li><li data-t="inclus_6"></li>
        </ul>
        <p class="note"><a href="exemple/multimartin.html" data-t="voir_exemple"></a></p>
      </div>
      <div class="bloc achat">
        <h2 data-t="achat_titre"></h2>
        <p class="prix"><span id="prix"></span> <small data-t="par_robot"></small></p>
        <p class="delai" data-t="delai"></p>
        <a id="commander" class="bouton" href="#"></a>
        <p class="note" id="note-commande"></p>
      </div>
    </div>

    <div class="colonnes">
      <div class="bloc">
        <h2 data-t="comment_titre"></h2>
        <ol class="etapes"><li data-t="etape_1"></li><li data-t="etape_2"></li><li data-t="etape_3"></li></ol>
      </div>
      <div class="bloc">
        <h2 data-t="robots_titre"></h2>
        <p data-t="robots_texte" style="margin:0"></p>
      </div>
    </div>

    <section class="faq" aria-labelledby="faq-titre">
      <h2 id="faq-titre" data-t="faq_titre"></h2>
      <details><summary data-t="q1"></summary><p data-t="r1"></p></details>
      <details><summary data-t="q2"></summary><p data-t="r2"></p></details>
      <details><summary data-t="q3"></summary><p data-t="r3"></p></details>
      <details><summary data-t="q4"></summary><p data-t="r4"></p></details>
    </section>

    <a class="retour" href="index.html" data-t="retour"></a>
  </main>

  <footer><div class="contenu"><p data-t="pied"></p></div></footer>

<script>
(function () {
  "use strict";
  // ---- RÉGLAGES DE LA BOUTIQUE ----------------------------------------------------------
  // Tant que LIEN_PAIEMENT est vide, le bouton affiche « commandes bientôt ouvertes » et ne
  // collecte rien. Coller ici le lien de paiement (Lemon Squeezy…) une fois la boutique créée.
  const LIEN_PAIEMENT = "";
  const PRIX = "29 €";
  // ----------------------------------------------------------------------------------------

  const T = {
    fr: {
      titre: "Faites tester un robot par le labo, avant de le payer.",
      intro: "Le rapport d'un vendeur montre ce qu'il veut bien montrer. MantaLab fait tourner le robot lui-même dans MetaTrader 5, le soumet à plusieurs scénarios, et vous remet une fiche indépendante.",
      inclus_titre: "Ce que contient la fiche",
      inclus_1: "Le verdict de risque, avec les raisons, chiffres et exemples tirés des trades.",
      inclus_2: "Martingale (classique ou « de grille »), grille, stops absents ou virtuels, trades ultra-courts.",
      inclus_3: "Le pire observé : série de pertes, exposition maximale, drawdown.",
      inclus_4: "4 scénarios : exécution idéale, retards d'exécution, ticks réels, année précédente.",
      inclus_5: "Notes de sécurité et de solidité sur 100, et 6 challenges de prop firms (FTMO, FundedNext, The5ers) simulés sur l'équité minute par minute.",
      inclus_6: "Le robot est testé par le labo lui-même : vous n'avez rien à installer. Fiche en ligne et en PDF.",
      voir_exemple: "Voir une fiche d'exemple (robot MultiMartin) →",
      achat_titre: "Audit d'un robot",
      par_robot: "par robot",
      delai: "Fiche livrée par e-mail sous 48 h.",
      commander: "Commander l'audit",
      bientot: "Commandes bientôt ouvertes",
      note_bientot: "Les commandes ouvrent très prochainement. En attendant, la vérification gratuite d'un rapport est disponible sur la page d'accueil.",
      note_paiement: "Paiement sécurisé. Vous indiquez le robot à tester au moment de la commande.",
      comment_titre: "Comment ça se passe",
      etape_1: "Vous commandez et indiquez le robot : lien de sa page sur le Market MQL5 (la démo gratuite suffit). Robot vendu ailleurs ou créé avec ChatGPT ou Claude : vous nous envoyez son fichier (.ex5 ou code .mq5) en réponse à l'e-mail de confirmation.",
      etape_2: "Le labo installe le robot et le teste dans les 4 scénarios, avec ses réglages par défaut (ou ceux que vous précisez).",
      etape_3: "Vous recevez la fiche : en ligne et en PDF.",
      robots_titre: "Quels robots ?",
      robots_texte: "Les robots (« Expert Advisors ») MetaTrader 5, gratuits ou payants : ceux du Market qui ont une démo gratuite, et tout robot dont vous avez le fichier, y compris ceux créés avec une IA. Un robot acheté sur le Market est verrouillé sur le compte de l'acheteur : pour ceux-là, il faut la démo. Si le labo ne peut pas tester votre robot, vous êtes remboursé intégralement. Un symbole et une unité de temps par audit, au choix.",
      faq_titre: "Questions fréquentes",
      q1: "Est-ce un conseil d'investissement ?",
      r1: "Non. La fiche décrit le comportement observé du robot dans nos tests. Elle ne dit pas s'il faut l'acheter, et les résultats passés ne préjugent pas des résultats futurs.",
      q2: "Êtes-vous liés aux vendeurs de robots ou à MetaQuotes ?",
      r2: "Non. MantaLab est indépendant : aucun vendeur ne paie pour être audité favorablement.",
      q3: "Pourquoi pas simplement le rapport du vendeur ?",
      r3: "Parce qu'il est choisi par le vendeur : période, réglages, conditions. Le labo produit ses propres tests, dans des conditions moins favorables, et cherche les comportements que le rapport ne montre pas.",
      q4: "Quelles sont les limites ?",
      r4: "Un test décrit le passé, sur un symbole et une période. Il ne couvre pas tous les réglages possibles d'un robot. La fiche indique toujours ce qui a été testé.",
      retour: "← Vérifier gratuitement un rapport",
      pied: "MantaLab — test indépendant de robots MetaTrader 5. Ce service ne constitue pas un conseil en investissement.",
    },
    en: {
      titre: "Have a robot tested by the lab, before you pay for it.",
      intro: "A seller's report shows what the seller wants you to see. MantaLab runs the robot itself in MetaTrader 5, puts it through several scenarios and gives you an independent report.",
      inclus_titre: "What the report contains",
      inclus_1: "The risk verdict, with reasons, figures and examples taken from the trades.",
      inclus_2: "Martingale (classic or “grid”), grid, missing or virtual stops, ultra-short trades.",
      inclus_3: "The worst observed: losing streak, maximum exposure, drawdown.",
      inclus_4: "4 scenarios: ideal execution, execution delays, real ticks, previous year.",
      inclus_5: "Safety and solidity scores out of 100, and 6 prop-firm challenges (FTMO, FundedNext, The5ers) simulated on minute-by-minute equity.",
      inclus_6: "The lab runs the robot itself: nothing for you to install. Report online and as a PDF.",
      voir_exemple: "See a sample report (MultiMartin robot) →",
      achat_titre: "Robot audit",
      par_robot: "per robot",
      delai: "Report delivered by email within 48 h.",
      commander: "Order the audit",
      bientot: "Orders opening soon",
      note_bientot: "Orders open very soon. Meanwhile, the free report check is available on the home page.",
      note_paiement: "Secure payment. You tell us which robot to test when ordering.",
      comment_titre: "How it works",
      etape_1: "You order and tell us the robot: its MQL5 Market page link (the free demo is enough). Robot sold elsewhere or built with ChatGPT or Claude: send us its file (.ex5 or .mq5 source) by replying to the confirmation e-mail.",
      etape_2: "The lab installs the robot and tests it in the 4 scenarios, with its default settings (or the ones you specify).",
      etape_3: "You receive the report: online and as a PDF.",
      robots_titre: "Which robots?",
      robots_texte: "MetaTrader 5 robots (Expert Advisors), free or paid: Market robots with a free demo, and any robot whose file you have, including ones built with AI. A robot bought on the Market is locked to the buyer's account: for those, we need the demo. If the lab cannot test your robot, you get a full refund. One symbol and timeframe per audit, of your choice.",
      faq_titre: "Frequently asked questions",
      q1: "Is this investment advice?",
      r1: "No. The report describes the robot's observed behaviour in our tests. It does not tell you whether to buy it, and past results do not guarantee future results.",
      q2: "Are you linked to robot sellers or MetaQuotes?",
      r2: "No. MantaLab is independent: no seller pays to be rated favourably.",
      q3: "Why not just use the seller's report?",
      r3: "Because the seller chooses it: period, settings, conditions. The lab runs its own tests, in less favourable conditions, and looks for the behaviours the report doesn't show.",
      q4: "What are the limits?",
      r4: "A test describes the past, on one symbol and one period. It doesn't cover every possible setting of a robot. The report always states what was tested.",
      retour: "← Check a report for free",
      pied: "MantaLab — independent MetaTrader 5 robot testing. This service is not investment advice.",
    },
  };

  let langue = "fr";
  try { const l = localStorage.getItem("labo-langue"); if (l === "en" || l === "fr") langue = l; else if ((navigator.language || "").slice(0, 2) !== "fr") langue = "en"; } catch (e) {}

  function appliquer() {
    const L = T[langue];
    document.documentElement.lang = langue;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = L[el.dataset.t] || ""; });
    document.getElementById("prix").textContent = PRIX;
    const b = document.getElementById("commander"), note = document.getElementById("note-commande");
    if (LIEN_PAIEMENT) {
      b.href = LIEN_PAIEMENT; b.textContent = L.commander; b.removeAttribute("aria-disabled"); note.textContent = L.note_paiement;
    } else {
      b.removeAttribute("href"); b.setAttribute("aria-disabled", "true"); b.textContent = L.bientot; note.textContent = L.note_bientot;
    }
    document.querySelectorAll("[data-lang]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lang === langue)));
  }
  document.querySelectorAll("[data-lang]").forEach((x) => x.addEventListener("click", () => {
    langue = x.dataset.lang; try { localStorage.setItem("labo-langue", langue); } catch (e) {} appliquer();
  }));
  appliquer();
})();
</script>
</body>
</html>
